[package]
name = "upload-plugin-pixiv"
version = "0.1.0"
edition = "2021"

[dependencies]
upload-plugin-sdk = { path = "../../crates/upload-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "query", "rustls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[workspace]
